<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="机械工程个人作品集与简历 PDF">
  <title>机械工程 · 个人作品集</title>
  <style>
    :root {
      --ink: #172433;
      --muted: #667383;
      --line: #dce3e9;
      --accent: #174b6e;
      --accent-hover: #103b59;
      --surface: #f4f7f9;
    }

    * { box-sizing: border-box; }

    html { background: #fff; }

    body {
      margin: 0;
      color: var(--ink);
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100% - 32px, 980px);
      margin: 0 auto;
      padding: max(48px, env(safe-area-inset-top)) 0 44px;
    }

    .hero {
      position: relative;
      padding: 32px 0 34px;
      border-top: 5px solid var(--accent);
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 50px);
      line-height: 1.18;
      letter-spacing: -.02em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 3.5vw, 19px);
      letter-spacing: .04em;
    }

    .intro {
      display: grid;
      gap: 22px;
      padding: 34px 0 38px;
    }

    .intro p {
      max-width: 660px;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: #fff;
      background: var(--accent);
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: background .15s ease, border-color .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .button:hover,
    .button:focus-visible {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
    }

    .button:focus-visible {
      outline: 3px solid rgba(23, 75, 110, .2);
      outline-offset: 3px;
    }

    .preview {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .preview-note {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .preview object {
      display: block;
      width: 100%;
      height: min(76vh, 920px);
      min-height: 620px;
      border: 0;
      background: #fff;
    }

    .fallback {
      padding: 48px 24px;
      color: var(--muted);
      text-align: center;
    }

    footer {
      padding-top: 26px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 680px) {
      .page {
        width: min(100% - 28px, 980px);
        padding-top: max(24px, env(safe-area-inset-top));
      }

      .hero { padding: 24px 0 27px; }
      .intro { padding: 28px 0 30px; }
      .actions, .button { width: 100%; }
      .preview { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">Engineering · Research · Design</p>
      <h1>机械工程 · 个人作品集</h1>
      <p class="subtitle" lang="en">Mechanical Engineering Portfolio</p>
    </header>

    <section class="intro" aria-labelledby="portfolio-action">
      <p>点击下方按钮查看完整作品集。页面采用轻量静态设计，适合微信手机浏览，也可在电脑端直接预览 PDF。</p>
      <div class="actions">
        <a class="button" id="portfolio-action" href="portfolio.pdf" aria-label="查看完整作品集 PDF">
          查看完整作品集 PDF
        </a>
      </div>
    </section>

    <section class="preview" aria-label="作品集 PDF 预览">
      <div class="preview-head">
        <span>PDF 预览</span>
        <span class="preview-note">若未显示，请使用上方按钮打开</span>
      </div>
      <object data="portfolio.pdf#view=FitH" type="application/pdf">
        <div class="fallback">
          当前浏览器不支持内嵌 PDF。请点击“查看完整作品集 PDF”。
        </div>
      </object>
    </section>

    <footer>Mechanical Engineering Portfolio</footer>
  </main>
</body>
</html>
